name: Verify AUTO SPORTS build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storefront-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://autosport:autosport@127.0.0.1:5432/autosport
      APP_ORIGIN: http://localhost:3000
      ADMIN_ORIGIN: http://localhost:3001
      ENABLE_TEST_PAYMENTS: "false"
      SHOPIFY_STORE_DOMAIN: autosport-trading.myshopify.com
      SHOPIFY_ADMIN_ACCESS_TOKEN: ""
      SHOPIFY_API_VERSION: "2026-07"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck storefront
        run: pnpm --filter @autosport/storefront lint

      - name: Build storefront
        run: pnpm --filter @autosport/storefront build
